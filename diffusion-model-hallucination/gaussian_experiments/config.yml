laplace-ensemble:
  # --- File Paths & Basic Model Details ---
  llla_sampled_models_dir: "/dtu/blackhole/13/213811/s243425/gaussian_experiment/models/llla_sampled"
  last_layer_name: "out_fc" # Only used if subset='last_layer'
  
  # --- Compute / Resource Parameters ---
  # Essential for accuracy: How much data you use to compute the Hessian matrix. 
  # Higher = better approximation, but takes longer and uses more memory. 64x2048 is a good robust default.
  laplace_batches: 64
  laplace_batch_size: 2048

  # --- CRITICAL REGULARIZATION PARAMETERS (ESSENTIAL FOR GOOD RESULTS) ---
  # Essential: Acts as the `lambda` in (H + \lambda I)^-1. High values (e.g., 10.0) 
  # strictly prevent the model from collapsing to noise by regularizing flat directions in the loss landscape.
  prior_precision: 400.0 
  
  # Essential: Hard cap on how much a single parameter can be perturbed. Needs to be low 
  # for neural networks (e.g., 0.05 - 0.1) so weights don't explode.
  max_posterior_std: null 
  
  # Simplification: With proper prior_precision & max_posterior_std, you can just leave this at 1.0 (no effect).
  sample_temperature: 1.0 

  # --- Algorithmic Choices (ESSENTIAL) ---
  # Essential: 'ggn' (Generalized Gauss-Newton) is mathematically the most robust and matches your paper's derivation.
  curvature: "ggn"
  
  # Essential: 'last_layer' is safer but less expressive. 'random' is more expressive but requires tuning the regularizers above.
  subset: "random"
  
  # Essential if subset='random': Number of parameters to capture. 3000 is a sweet spot. 
  # Too low = no uncertainty diversity. Too high = requires extreme prior_precision to remain stable.
  m: 1000 

  # --- Optional / Fine-Tuning ---
  # Optional: Automatically tightens the max_posterior_std if you drastically increase 'm'. 
  # You can ignore modifying this as long as you keep 'm' around 1000-5000.
  std_reference_subnetwork_size: 1000 

  # Reproducibility & Downstream Tasks ---
  weight_sampling_seed: 42
  subset_seed: 42        
  n_score_samples: 1000  # number of samples for FLARE scoring (downstream task)
  flare_samples_cache_dir: "/dtu/blackhole/13/213811/s243425/gaussian_experiment/samples/flare"

lora-ensemble:
  lora_sampled_models_dir: "/dtu/blackhole/13/213811/s243425/gaussian_experiment/models/lora_sampled"
  M: 5
  r: 16
  alpha: 4.0
  epochs: 20 
  lr: 0.001
  batch_size: 2048

