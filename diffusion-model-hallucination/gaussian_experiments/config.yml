laplace-ensemble:
  llla_sampled_models_dir: "/dtu/blackhole/13/213811/s243425/gaussian_experiment/models/llla_sampled"
  last_layer_name: "out_fc"
  laplace_batches: 64
  laplace_batch_size: 2048
  weight_sampling_seed: 42
  sample_temperature: 0.5
  prior_precision: 0.01
  # Toggle: 'last_layer' (only out_fc) | 'random' (m params across all layers)
  subset: "random"
  # Toggle: 'ef' (empirical Fisher, grad of loss) | 'ggn' (generalized GN, grad of output)
  curvature: "ef"
  m: 1000                # subnetwork size (only used when subset='random')
  subset_seed: 42        # RNG seed for random subset selection
  max_posterior_std: 1.0 # cap on posterior std for random-subnetwork stability; set null to disable
  std_reference_subnetwork_size: 1000 # scales cap as sqrt(m_ref / m) when m > m_ref
  n_score_samples: 1000  # number of samples for FLARE scoring
  flare_samples_cache_dir: "/dtu/blackhole/13/213811/s243425/gaussian_experiment/samples/flare"

# was trained with Aithal et al. original code
deep-ensemble:
  # trained_models_dir: "chkpts/gaussian25_100000_g_1_e_10000_t1000_m128_nl3_blinear_seed{seed}_s1_fds_ensemble_model_seed_{seed}"
  trained_models_dir: "chkpts/gaussian25_100000_g_1_e_10000_t1000_m128_nl3_blinear_seed{seed}_fixed_ds_ensemble_model_seed_{seed}" 
  sel_generation: 0
  M: 5

sampling:
  num_samples: 100000
  batch_size: 10000
  samples_cache_dir: "/dtu/blackhole/13/213811/s243425/gaussian_experiment/samples"