[project]
name = "thesis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "transformers",
    "numpy>=2.0",
    "tqdm>=4.67.3",
    "pillow>=12.1.1",
    "clip",
    "laplace-torch>=0.2.2.2",
    "click>=8.3.1",
    "blobfile>=3.2.0",
    "lmdb>=2.2.0",
    "ml-collections>=1.1.0",
    "pathlib>=1.0.1",
    "matplotlib>=3.10.8",
    "jupyter>=1.1.1",
    "scipy>=1.17.1",
    "open-clip-torch>=3.3.0",
    "scikit-learn>=1.8.0",
    "jax>=0.9.2",
    "nbstripout>=0.9.1",
    "curvlinops-for-pytorch<3",
    "wandb>=0.25.1",
    "pandas>=3.0.2",
    "hpsv3>=1.0.0",
    "tensorboard>=2.20.0",
    "python-dotenv>=1.2.2",
    "accelerate>=1.13.0",
    "diffusers==0.29.2",
    "peft>=0.10.0",
    "shared-utils",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
clip = { git = "https://github.com/openai/CLIP.git" }
shared-utils = { workspace = true, editable = true }

[tool.uv.workspace]
members = [
    "shared_utils",
]
